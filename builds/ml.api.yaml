services:
  ml-api:
    image: ufc-ml-api:local
    build:
      context: ..
      dockerfile: builds/docker/api.Dockerfile
    ports:
      - "${UFC_ML_API_PORT:-8000}:8000"
    environment:
      UFC_ML_ASSETS_DIR: /var/lib/ufc-ml-assets
      UFC_ML_CORS_ORIGINS: ${UFC_ML_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      GITHUB_ASSETS_TOKEN: ${GITHUB_ASSETS_TOKEN:-}
      UFC_ML_ASSETS_REPOSITORY: ${UFC_ML_ASSETS_REPOSITORY:-}
      UFC_ML_ASSETS_REF: ${UFC_ML_ASSETS_REF:-}
    command:
      - --config
      - ${UFC_ML_API_CONFIG:-configs/default.yaml}
      - --run-dir
      - ${UFC_ML_API_RUN_DIR:-artifacts/active}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      # Local Compose runs mount approved assets at runtime rather than baking
      # them into the image. Production hosts can provide the same paths from
      # their private asset store instead.
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts:ro
      - ufc_ml_api_runtime:/var/lib/ufc-ml-assets
    restart: unless-stopped

volumes:
  ufc_ml_api_runtime:
