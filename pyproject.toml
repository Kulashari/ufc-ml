[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ufc-predictor"
version = "0.1.0"
description = "Leakage-safe UFC fight probability training and inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sarth" }]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "xgboost>=2.0",
]

[project.optional-dependencies]
optuna = ["optuna>=3.6"]
web = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]
dev = [
  "fastapi>=0.115,<1.0",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
ufc-predictor = "ufc_predictor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ufc_predictor"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"src/ufc_predictor/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["ufc_predictor"]
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost", "xgboost.*", "sklearn.*", "joblib"]
ignore_missing_imports = true
